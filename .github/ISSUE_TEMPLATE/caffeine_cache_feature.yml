name: ✨ 功能需求
description: 提交新功能开发或现有功能优化的需求
labels: ["feature", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        # 功能需求提交模板
        请清晰描述需求背景、核心诉求和业务价值，便于评估和实现
  - type: textarea
    id: feature-background
    attributes:
      label: 📖 需求背景
      description: 该需求解决什么业务问题/用户痛点？
      placeholder: 示例：帖子列表加载速度慢，用户反馈等待时间过长
    validations:
      required: true

  - type: textarea
    id: feature-core
    attributes:
      label: 🎯 核心诉求
      description: 具体需要实现的功能点（分点说明）
      placeholder: |
        1. 新增帖子列表本地缓存
        2. 缓存过期时间可配置
        3. 支持缓存主动刷新
    validations:
      required: true

  - type: textarea
    id: feature-value
    attributes:
      label: 💡 业务价值
      description: 该需求能带来的收益（性能/体验/成本等）
      placeholder: 示例：列表加载速度从2s降至0.2s，提升用户留存率
    validations:
      required: true

  - type: textarea
    id: feature-suggestion
    attributes:
      label: 📝 实现建议（可选）
      description: 你认为该功能如何实现更合理？
      placeholder: 示例：基于 Caffeine 实现，配置 10 分钟过期时间，最大容量 5000
    validations:
      required: false

  - type: textarea
    id: additional-info
    attributes:
      label: 📎 补充信息（可选）
      description: 相关参考链接、截图、优先级等
    validations:
      required: false
